# This file is included inside http{} by the nginx:alpine base image, so
# http-level directives (limit_req_zone, map) belong here, above server{}.
#
# BYTE-IDENTICAL between cadran-seo and transvase. Nothing site-specific may
# enter this file; the upstream is reached through the compose SERVICE name
# `api`, which is the same in both projects (the container_name differs).
# Check: sha256sum nginx.conf in both repos must match.

# Card-testing and lead-spam throttle. $binary_remote_addr is the visitor's
# address rather than Traefik's because the realip module in server{} rewrites
# it during the post-read phase, which runs before limit_req is evaluated in
# preaccess. Without that pairing this zone would hold exactly one bucket, for
# 10.0.1.31, and one attacker would 503 every buyer on earth.
limit_req_zone $binary_remote_addr zone=api:10m rate=1r/s;
# Default is 503 + an HTML body. The api's own limiter answers 429 with
# JSON; two limiters disagreeing on the status is how the client ends up
# showing the wrong message for the commonest throttle.
limit_req_status 429;

# Cache policy is keyed on $uri as it stands when the response headers are
# written -- that is, after try_files has rewritten the request internally.
#
# No location{} block can do this job, and the previous config's
# `location = /index.html` did nothing at all. Measured 31/08/2026 on nginx
# 1.31.4 by echoing $uri and $request_uri into debug headers:
#
#     GET /      ->  $request_uri "/"      $uri "//index.html"
#     GET /en/   ->  $request_uri "/en/"   $uri "/en//index.html"
#
# Two separate reasons, either of which is fatal to a location-based rule.
# (1) try_files concatenates its second parameter as $uri + "/index.html" and
#     does not collapse the resulting double slash.
# (2) try_files rewrites the URI WITHOUT re-running location selection, so a
#     second location is never consulted no matter what it matches.
# Result: the old config advertised a cache policy it never applied to either
# of the two URLs anyone actually visits.
#
# Hence a map evaluated at header-write time, with `/+` where the double slash
# appears. The image contains three unversioned files and all three must
# revalidate -- a stale checkout.js after a deploy is a dead pay button.
map $uri $cache_control {
    default                                       "";
    ~^/+(?:(?:en/+)?index\.html|checkout\.js)$    "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Load-bearing: see the two /api/ blocks, where the
    # upstream host is resolved per request instead of once at config load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Traefik is the only client that can reach this container; trust its
    # forwarded address so the rate limit keys on the visitor, not on 10.0.1.31.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Emit relative Location headers. TLS terminates at Traefik, so nginx sees
    # scheme=http; an absolute redirect would send an https visitor to an http
    # URL and rely on the edge middleware to bounce them back.
    absolute_redirect off;

    # Never serve a dotfile, but leave /.well-known reachable.
    # There is no sibling rule for README.md / LICENSE / nginx.conf /
    # docker-compose.yml any more: the Dockerfile copies four files by name, so
    # those never enter the image and the old rules guarded nothing. A dead
    # rule believed live is worse than an absent one.
    location ~ /\.(?!well-known/) { deny all; return 404; }

    gzip on;
    # text/html is always gzipped by nginx and listing it logs a duplicate-MIME
    # warning on every start (measured 31/08/2026).
    gzip_types text/css application/javascript image/svg+xml;

    # add_header does NOT merge across levels: any location{} that sets a single
    # add_header silently drops every add_header inherited from here. Measured
    # 31/08/2026 on the previous config: `location = /index.html` returned
    # Cache-Control and lost X-Content-Type-Options and Referrer-Policy. That is
    # why the cache policy above is a map and not a location, and why no block
    # below this point may add a header. If you ever need one there, repeat all
    # four verbatim.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # An empty $cache_control makes nginx omit the header entirely.
    add_header Cache-Control $cache_control always;
    # Sources, checked against what the four pages really load:
    #   'unsafe-inline' style     -- every page's CSS is one inline <style>,
    #                                plus style="" attributes, plus the <style>
    #                                checkout.js injects at runtime.
    #   fonts.googleapis.com      -- the Google Fonts stylesheet, style-src only.
    #                                It is deliberately NOT in connect-src:
    #                                checked 31/08/2026, checkout.js passes no
    #                                `fonts: [{cssSrc}]` to elements(), so the
    #                                Element never fetches it. If that ever
    #                                changes, connect-src must gain this host or
    #                                the custom font silently never loads
    #                                inside the card frame.
    #   fonts.gstatic.com         -- the font files that stylesheet points at.
    #   data:                     -- the inline SVG emoji favicon.
    #   *.link.com / link.com     -- Link is enabled in the account's default
    #                                payment_method_configuration and renders
    #                                inside the Payment Element. Stripe's CSP
    #                                guide lists these as REQUIRED IN ADDITION
    #                                to the Stripe.js set; without them the Link
    #                                tab is a blank frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com https://*.link.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com; connect-src 'self' https://api.stripe.com https://*.js.stripe.com https://link.com https://*.link.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # /en/ is canonical. Without this, try_files serves /en and /en/ as two
    # byte-identical 200s at two indexable URLs.
    location = /en { return 301 /en/; }

    # Stripe's retries must never be throttled, so this endpoint carries no
    # limit_req -- a 503 to Stripe is a lost sale notification. It is its own
    # exact location purely to raise the body cap; the api rejects anything
    # over 65536 bytes itself.
    location = /api/stripe-webhook {
        client_max_body_size 64k;
        set $api http://api:3000;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location /api/ {
        limit_req zone=api burst=5 nodelay;
        client_max_body_size 8k;
        # `set` + variable, never a literal hostname in proxy_pass. A literal
        # resolves ONCE at config load: an api-only redeploy gives the api a new
        # IP, nginx keeps the old one, and 100% of checkouts 502 while both
        # containers report healthy, Traefik is happy, and nothing about nginx
        # has changed -- so nobody thinks to restart it. This is the single most
        # load-bearing line in the file.
        set $api http://api:3000;
        # $request_uri passes the path through unchanged: no prefix stripping,
        # the api serves literal /api/... routes, and the %2f normalisation
        # question never arises.
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # Two pages and one script. An unknown path is a 404, not a copy of the
    # homepage: falling back to index.html would let search engines index every
    # mistyped URL as duplicate content. (No longer a one-page site -- /en/
    # ships in this image, and the redirect above is what keeps it one URL.)
    location / { try_files $uri $uri/index.html =404; }
}
